<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>NexFi - Finanças pessoais</title>
    <meta
      name="description"
      content="Contas, cartões, financiamentos e metas em um só lugar, com projeção de saldo e das faturas mês a mês."
    />

    <!-- Ícones (gerados por scripts/generate-brand-assets.mjs). O ?v= força navegador e Cloudflare a
         buscarem a versão nova: incremente sempre que regerar as imagens. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="theme-color" content="#0B0F19" />
    <!-- iOS: nome e barra de status quando adicionado à tela de início -->
    <meta name="apple-mobile-web-app-title" content="NexFi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Prévia de link (WhatsApp, Telegram, LinkedIn, X…). A imagem precisa de URL absoluta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexFi" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://nexfi.abdalanexus.com/" />
    <meta property="og:title" content="NexFi - Finanças pessoais" />
    <meta
      property="og:description"
      content="Contas, cartões, financiamentos e metas em um só lugar, com projeção de saldo e das faturas mês a mês."
    />
    <meta property="og:image" content="https://nexfi.abdalanexus.com/og-image.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Logo do NexFi" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NexFi - Finanças pessoais" />
    <meta
      name="twitter:description"
      content="Contas, cartões, financiamentos e metas em um só lugar, com projeção de saldo e das faturas mês a mês."
    />
    <meta name="twitter:image" content="https://nexfi.abdalanexus.com/og-image.png?v=3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
