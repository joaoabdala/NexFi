version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nexfi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexfi
      POSTGRES_PASSWORD: nexfi
      POSTGRES_DB: nexfi
    ports:
      - "5432:5432"
    volumes:
      - nexfi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexfi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: nexfi_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nexfi:nexfi@db:5432/nexfi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  nexfi_db_data:
